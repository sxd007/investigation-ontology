# 审批单 Schema（Approval）
# 适用范围：付款审批单、采购审批单、费用审批单、用款申请单、OA 审批流程单
#
# 调查视角重点关注：
#   - 审批链完整性（是否越级审批、跳过节点、替代审批）
#   - 审批时间（异常快速审批、非工作时间审批、审批日期倒签）
#   - 审批人权限（审批人是否有对应金额/事项的审批权限）
#   - 关联单据（审批事项与实际付款/采购是否一致）

document_type: APPROVAL
description: "审批单/申请单（含付款/采购/费用/用款等 OA 审批流程单）"
version: "1.0"

fields:
  # ============================================================
  # 单据标识
  # ============================================================
  - name: approval_no
    label: 审批单号
    type: string
    required: false
    confidence_tracking: true
    description: "系统内审批单号，用于关联报销单/付款凭证/采购订单"

  - name: approval_type
    label: 审批类型
    type: enum
    required: true
    confidence_tracking: true
    enum_values:
      - value: "payment"       # 付款审批
      - value: "procurement"   # 采购审批
      - value: "expense"       # 费用审批
      - value: "contract"      # 合同审批
      - value: "fund_use"      # 用款申请
      - value: "hr"            # 人事/用工审批
      - value: "other"

  - name: apply_date
    label: 申请日期
    type: date
    format: "YYYY-MM-DD"
    required: true
    confidence_tracking: true

  # ============================================================
  # 申请人与部门
  # ============================================================
  - name: applicant_name
    label: 申请人
    type: string
    required: true
    confidence_tracking: true

  - name: applicant_department
    label: 申请部门
    type: string
    required: false
    confidence_tracking: true

  # ============================================================
  # 申请事项与金额
  # ============================================================
  - name: subject
    label: 事由/申请内容
    type: text
    required: true
    confidence_tracking: true
    description: >
      申请审批的事项说明。调查关键字段——
      与实际付款/采购内容不符、事由笼统、
      或拆分金额规避审批权限，均为异常信号。

  - name: amount
    label: 申请金额
    type: decimal
    required: false
    confidence_tracking: true
    description: "审批涉及金额。拆分为多张小额审批规避高层审批是舞弊信号"

  - name: currency
    label: 币种
    type: string
    required: false
    confidence_tracking: true
    default: "CNY"

  # ============================================================
  # 审批节点链（调查核心）
  # ============================================================
  - name: approval_nodes
    label: 审批节点
    type: array
    required: true
    confidence_tracking: true
    description: >
      审批流经过的各节点。调查核心——
      检查越级审批、跳过节点、替代审批、审批时间倒签、异常快速审批。
    items:
      type: object
      properties:
        - name: node_order
          label: 节点顺序
          type: integer

        - name: node_role
          label: 审批角色/职务
          type: string
          description: "如'部门负责人'、'财务总监'、'总经理'"

        - name: approver_name
          label: 审批人
          type: string
          required: true

        - name: approval_result
          label: 审批结果
          type: enum
          enum_values:
            - value: "approved"    # 同意
            - value: "rejected"    # 驳回
            - value: "returned"    # 退回
            - value: "delegated"   # 转办/代批
            - value: "pending"     # 待审

        - name: approval_opinion
          label: 审批意见
          type: string

        - name: approval_time
          label: 审批时间
          type: string
          description: "审批的日期时间（精确到时分更佳）。用于检测异常快速/倒签审批"

  # ============================================================
  # 最终结果
  # ============================================================
  - name: final_result
    label: 最终审批结果
    type: enum
    required: false
    confidence_tracking: true
    enum_values:
      - value: "approved"
      - value: "rejected"
      - value: "in_progress"

  # ============================================================
  # 关联单据
  # ============================================================
  - name: related_documents
    label: 关联单据编号
    type: array
    required: false
    confidence_tracking: true
    description: "本审批关联的合同/订单/发票/报销单编号。审批与实际单据不一致是异常信号"
    items:
      type: object
      properties:
        - name: doc_type
          label: 单据类型
          type: string

        - name: doc_no
          label: 单据编号
          type: string

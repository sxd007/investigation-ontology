<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>__TITLE__ · 制度解构导览</title>
<style>
:root{--bg:#f4f6f8;--panel:#fff;--ink:#17202a;--muted:#65717e;--line:#dce2e8;--blue:#1769aa;--blue2:#e9f3fb;--green:#247a52;--amber:#a75d00;--red:#b42318;--shadow:0 8px 28px rgba(25,38,52,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","Microsoft YaHei",sans-serif}button,input{font:inherit}.top{padding:22px 28px;background:#12344d;color:#fff}.top h1{margin:0 0 4px;font-size:24px}.top p{margin:0;color:#c9dae6}.status{display:inline-block;margin-left:8px;padding:2px 8px;border:1px solid #7ea5bf;border-radius:999px;font-size:12px}.layout{display:grid;grid-template-columns:minmax(540px,1fr) minmax(360px,.72fr);gap:16px;padding:16px;min-height:calc(100vh - 92px)}.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}.toolbar{display:flex;gap:8px;align-items:center;padding:12px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:3}.tabs{display:flex;gap:4px;flex-wrap:wrap}.tab,.filter{border:0;background:transparent;padding:7px 10px;border-radius:7px;color:var(--muted);cursor:pointer}.tab.active,.tab:hover,.filter:hover{background:var(--blue2);color:var(--blue)}.search{margin-left:auto;min-width:180px;border:1px solid var(--line);border-radius:7px;padding:7px 10px}.content{padding:16px;max-height:calc(100vh - 170px);overflow:auto}.view{display:none}.view.active{display:block}.intro{padding:13px 15px;background:#edf6fc;border-left:4px solid var(--blue);border-radius:8px;margin-bottom:14px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0}.metric{padding:12px;border:1px solid var(--line);border-radius:9px}.metric b{display:block;font-size:22px;color:var(--blue)}h2{font-size:18px;margin:18px 0 10px}h3{font-size:15px;margin:14px 0 8px}.card{border:1px solid var(--line);border-radius:9px;padding:11px 12px;margin:8px 0;cursor:pointer;transition:.15s;flex:1}.card:hover,.card.selected{border-color:#65a6d3;background:#f5faff}.card-head{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.card-title{font-weight:650}.card-id{font:11px ui-monospace,Consolas,monospace;color:var(--muted)}.detail{color:var(--muted);margin-top:4px}
.badge{display:inline-block;padding:2px 7px;border-radius:999px;background:#edf0f3;color:#58636f;font-size:11px}.badge.warn{background:#fff3dd;color:var(--amber)}.badge.danger{background:#feeceb;color:var(--red)}
.badge.k-process,.chip.k-process{background:#e5f1fa;color:#155d8d}.badge.k-rule,.chip.k-rule{background:#e0f5f2;color:#0f766e}.badge.k-objective,.chip.k-objective{background:#e8f6ec;color:#247a52}.badge.k-artifact,.chip.k-artifact{background:#f0eafa;color:#6d3fc0}.badge.k-edge,.chip.k-edge{background:#edf0f3;color:#58636f}.badge.k-role,.chip.k-role{background:#f4ece2;color:#8a5a2b}.badge.k-risk,.chip.k-risk{background:#feeceb;color:#b42318}.badge.k-control,.chip.k-control{background:#fff3dd;color:#a75d00}.badge.k-issue,.chip.k-issue{background:#fde2e2;color:#8f1d14}.badge.k-candidate,.chip.k-candidate{background:#e9e9f7;color:#4438a6}
.badge.lv-L1,.badge.lv-L2,.badge.lv-L3{background:#e5f1fa;color:#155d8d}.badge.lv-L4,.badge.lv-L5{background:#eef4f8;color:#4a6b84}
.chip{display:inline-block;max-width:190px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;vertical-align:middle;border:0;border-radius:6px;padding:3px 8px;font-size:12px;cursor:pointer;margin:1px 2px}.chip:hover{outline:2px solid #65a6d3}.chip.selected{outline:2px solid var(--blue)}.chip.raci{min-width:26px;text-align:center;font-weight:700}
.tree{margin-left:16px;border-left:1px dashed #b9c8d3;padding-left:12px}.tnode{display:flex;align-items:flex-start;gap:4px}.caret{flex:none;width:22px;height:22px;margin-top:10px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--blue);cursor:pointer;line-height:1;padding:0}.caret.closed{transform:rotate(0)}.caret:not(.closed){transform:rotate(90deg)}.caret-sp{flex:none;width:22px}
.vtoolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}.chk{color:var(--muted);font-size:13px;display:flex;gap:5px;align-items:center;cursor:pointer}
.process-box{border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}.flow{display:flex;align-items:center;gap:6px;flex-wrap:wrap}.flow-node{padding:6px 9px;background:#eef5fa;border-radius:7px}.arrow{color:var(--blue)}
table{border-collapse:collapse;width:100%}th,td{text-align:left;padding:8px;border-bottom:1px solid var(--line);vertical-align:top}th{color:var(--muted);font-weight:600}
table.mx th,table.mx td{border:1px solid var(--line);padding:6px 8px}table.mx th{background:#f7fafc;position:sticky;top:0}table.mx .rowlabel{min-width:230px}table.mx tr.pair td{background:#fff8e1}.mlink{color:var(--blue);cursor:pointer}.mlink:hover{text-decoration:underline}.crumb{display:block;font-size:11px;color:var(--muted);margin-bottom:2px}
.detail-block{margin-top:14px}.detail-block summary{cursor:pointer;color:var(--blue);font-weight:600}
.source-panel{position:relative}.source-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;gap:10px;align-items:flex-start;justify-content:space-between}.source-head h2{margin:0}.source-head .detail{margin-top:4px}.source-list{padding:12px 16px;max-height:calc(100vh - 165px);overflow:auto}.source-block{padding:12px;border:1px solid var(--line);border-radius:9px;margin-bottom:10px;scroll-margin-top:12px}.source-block.active{border:2px solid var(--blue);background:#f4faff}.source-block.dim{opacity:.3}.source-meta{color:var(--muted);font-size:12px;margin-bottom:6px}.source-text{white-space:pre-wrap}.explain{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}.explain strong{color:var(--blue)}.empty{padding:24px;text-align:center;color:var(--muted)}.method{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}.method div{padding:10px;background:#f7f9fa;border-radius:8px}.legend{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}
@media(max-width:980px){.layout{grid-template-columns:1fr}.content{max-height:none}.source-list{max-height:none}.metrics{grid-template-columns:repeat(2,1fr)}.source-panel{position:static}}@media print{.toolbar,.search,.vtoolbar,.caret{display:none}.layout{display:block}.panel{box-shadow:none;margin-bottom:12px}.content,.source-list{max-height:none}.view{display:block!important}.card{break-inside:avoid}.source-block.dim{opacity:1}}
</style></head><body>
<header class="top"><h1>制度解构导览 <span class="status" id="status"></span></h1><p id="subtitle"></p></header>
<main class="layout"><section class="panel"><div class="toolbar"><div class="tabs"><button class="tab active" data-view="overview">怎么读</button><button class="tab" data-view="hierarchy">流程分层</button><button class="tab" data-view="processes">流程提炼</button><button class="tab" data-view="roles">角色职责</button><button class="tab" data-view="trace">规则与风控</button><button class="tab" data-view="projection">本体投影</button></div><input id="search" class="search" placeholder="搜索名称、ID、角色…"></div><div class="content"><div id="overview" class="view active"></div><div id="hierarchy" class="view"></div><div id="processes" class="view"></div><div id="roles" class="view"></div><div id="trace" class="view"></div><div id="projection" class="view"></div></div></section><aside class="panel source-panel"><div class="source-head"><div><h2>原文对照</h2><div class="detail">左侧点击任一记录，右侧自动定位并高亮对应原文块；可继续滑动查看上下文。</div></div><button class="filter" id="clear-loc">清除定位</button></div><div id="sources" class="source-list"></div></aside></main>
<script id="policy-data" type="application/json">__POLICY_DATA__</script>
<script>
const M=JSON.parse(document.getElementById('policy-data').textContent);
const R=new Map(M.records.map(x=>[x.id,x]));
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const arr=v=>Array.isArray(v)?v:[];
const byKind=k=>[...R.values()].filter(x=>x.kind===k);
const KL={process:'流程',rule:'规则',objective:'目标',artifact:'Artifact',edge:'流转',role:'角色',risk:'风险',control:'控制',issue:'问题',candidate:'候选'};
let selected='';let pairElems=new Set();
const collapsed=new Set();
for(const x of R.values())if(x.kind==='process'&&x.level==='L3'&&arr(x.children).length){collapsed.add('m:'+x.id);collapsed.add('r:'+x.id)}
document.getElementById('status').textContent=M.meta.status;
document.getElementById('subtitle').textContent=M.meta.title+' · '+M.meta.doc_id+' · Digest '+M.meta.schema_version;
function badge(t,c=''){return '<span class="badge '+c+'">'+esc(t)+'</span>'}
function kbadge(k){return '<span class="badge k-'+k+'">'+esc(KL[k]||k)+'</span>'}
function card(x,body=''){return '<article class="card" data-id="'+esc(x.id)+'"><div class="card-head">'+kbadge(x.kind)+(x.level?badge(x.level,'lv-'+x.level):'')+'<span class="card-title">'+esc(x.title)+'</span></div><div class="card-id">'+esc(x.id)+'</div>'+(x.detail?'<div class="detail">'+esc(x.detail)+'</div>':'')+body+'</article>'}
function caretOf(key,hasKids){return hasKids?'<button class="caret'+(collapsed.has(key)?' closed':'')+'" data-toggle="'+esc(key)+'">▸</button>':'<span class="caret-sp"></span>'}
function subtreeHas(id,set){if(set.has(id))return true;return arr(R.get(id)?.children).some(c=>subtreeHas(c,set))}
function matrixRows(prefix,hasSet,filterOn){const rows=[];const w=(id,depth,ancHidden)=>{const x=R.get(id);if(!x)return;const show=!ancHidden&&(!filterOn||subtreeHas(id,hasSet));if(show)rows.push({x,depth});const next=ancHidden||collapsed.has(prefix+id);for(const c of arr(x.children))w(c,depth+1,next)};for(const r of M.roots)w(r,0,false);return rows}
function crumbOf(x){const names=[];let cur=x;while(cur&&cur.parent_ref){const p=R.get(cur.parent_ref);if(!p)break;names.unshift(p.title);cur=p}return names.length?'<span class="crumb">'+esc(names.join(' › '))+'</span>':''}
const roleRecs=byKind('role');
const roleNames=[];for(const r of roleRecs){const n=r.title.replace(/ · [RACIS]+$/,'');if(!roleNames.includes(n))roleNames.push(n)}
const roleCell=new Map();for(const r of roleRecs){const n=r.title.replace(/ · [RACIS]+$/,'');const k=r.element_ref+'||'+n;if(!roleCell.has(k))roleCell.set(k,[]);roleCell.get(k).push(r)}
const elemHasRole=new Set(roleRecs.map(r=>r.element_ref));
const traceMap=new Map();
function tpush(id,k,rec){if(!traceMap.has(id))traceMap.set(id,{objective:[],rule:[],risk:[],control:[]});traceMap.get(id)[k].push(rec)}
for(const o of byKind('objective'))for(const id of arr(o.links))tpush(id,'objective',o);
for(const r of byKind('rule'))for(const id of arr(r.links))tpush(id,'rule',r);
for(const r of byKind('risk'))for(const id of arr(r.links))tpush(id,'risk',r);
for(const c of byKind('control'))if(c.element_ref)tpush(c.element_ref,'control',c);
const elemHasTrace=new Set(traceMap.keys());
function chip(rec,extra=''){return '<button class="chip k-'+rec.kind+'" data-id="'+esc(rec.id)+'" title="'+esc(rec.id+' · '+rec.title)+'">'+esc(rec.id)+esc(extra)+'</button>'}
function why(x){if(x.kind==='process')return '根据原文中的目标、边界、责任、输入输出与执行粒度，将其判定为 '+x.level+'；分层依据为 '+(x.basis||'未记录')+'。';if(x.kind==='role')return '原文将“'+x.title.replace(/ · [RACIS]+$/,'')+'”与该流程元素关联，并按职责语义映射为 RACI '+x.raci+'。';if(x.kind==='artifact')return '该对象被识别为流程产出或输入，用于说明流程之间如何交接。';if(x.kind==='edge')return '该记录表达同一 L3 内的执行顺序或条件路径，不代表父子层级。';if(x.kind==='rule')return '从原文提取规范性要求，并通过关联 ID 指向落实该要求的流程元素。';if(x.kind==='candidate')return '这是由结构化记录投影到本体摄取交换层的候选。它仍需检查 Core 版本、proposal、参数、流转和人审状态。';if(x.kind==='risk'||x.kind==='control')return '此记录按 assertion_basis 区分制度明文与分析判断：'+(x.basis||'未记录')+'。';return '该结论保留独立来源锚点，需结合原文和审核状态判断。'}
function renderOverview(){const c=M.counts;document.getElementById('overview').innerHTML='<div class="intro"><b>这不是另一份摘要。</b> 它是可独立打开的审阅界面：左侧展示 AI 如何从制度原文形成规则、流程层级、角色、控制和本体候选；点击任何结构化记录，右侧自动定位到对应原文块并保留上下文。</div><div class="metrics">'+[['原文块',c.source_blocks],['L3 流程',c.processes],['规则',c.rules],['角色指派',c.roles],['流程元素',c.process_elements],['Artifact',c.artifacts],['本体候选',c.candidates],['问题',c.issues]].map(x=>'<div class="metric"><b>'+x[1]+'</b>'+x[0]+'</div>').join('')+'</div><h2>解构步骤</h2><div class="method"><div><b>1. 锚定原文</b><br>保留条款、结构路径、页码和原文块。</div><div><b>2. 识别规则</b><br>提取主体、触发、要求、参数和例外。</div><div><b>3. 划分流程</b><br>按独立目标、入口和输出判断 L3 边界。</div><div><b>4. 递归分层</b><br>形成 L1–L5 父子树，不照搬章节目录。</div><div><b>5. 识别交接</b><br>用 Artifact 的生产/消费连接不同流程。</div><div><b>6. 绑定治理</b><br>将 RACI、风险、控制和规则挂到准确层级。</div></div><h2>记录类型图例</h2><div class="legend">'+['process','rule','objective','artifact','edge','role','risk','control','issue','candidate'].map(kbadge).join('')+'</div><h2>审阅提示</h2><div class="legend">'+badge('explicit_text 明文')+badge('inferred_structure 推断','warn')+badge('unresolved 待确认','danger')+'</div>'}
function hnode(id){const x=R.get(id);if(!x)return '';const key='h:'+id;const kids=arr(x.children);const meta='<div class="legend">'+(x.basis?badge('依据：'+x.basis,x.basis==='inferred_structure'?'warn':''):'')+(x.hierarchy_status?badge('层级：'+x.hierarchy_status,x.hierarchy_status!=='resolved'?'danger':''):'')+'</div>';return '<div class="tnode">'+caretOf(key,kids.length)+card(x,meta)+'</div>'+((kids.length&&!collapsed.has(key))?'<div class="tree">'+kids.map(hnode).join('')+'</div>':'')}
function renderHierarchy(){document.getElementById('hierarchy').innerHTML='<div class="vtoolbar"><button class="filter" data-action="expand" data-scope="h:">全部展开</button><button class="filter" data-action="collapse" data-scope="h:">全部折叠</button></div><div class="intro">分层回答“它属于什么”，流转回答“它先后怎么做”。点击 ▸ 折叠或展开子树；点击节点核对直接父级、所属 L3、分层依据和置信度。</div>'+M.roots.map(hnode).join('')}
function pnode(id){const x=R.get(id);if(!x)return '';const key='p:'+id;const kids=arr(x.children);return '<div class="tnode">'+caretOf(key,kids.length)+card(x)+'</div>'+((kids.length&&!collapsed.has(key))?'<div class="tree">'+kids.map(pnode).join('')+'</div>':'')}
function renderProcesses(){let html='<div class="vtoolbar"><button class="filter" data-action="expand" data-scope="p:">全部展开</button><button class="filter" data-action="collapse" data-scope="p:">全部折叠</button></div><div class="intro">每个 L3 是具有独立目标、入口、活动和输出的可运行流程，可整体折叠。L4/L5 按父子层级缩进展示；跨 L3 协作通过 Artifact 交接，而不是伪造流程顺序边。</div>';for(const pid of M.process_ids){const p=R.get(pid);const key='p:'+pid;const isCol=collapsed.has(key);const descendants=[];const walk=id=>{for(const child of arr(R.get(id)?.children)){descendants.push(child);walk(child)}};walk(pid);const scope=new Set([pid,...descendants]);const edges=byKind('edge').filter(x=>x.process_ref===pid);const arts=byKind('artifact').filter(x=>arr(x.produced_by).some(id=>scope.has(id))||arr(x.consumed_by).some(id=>scope.has(id)));const objectives=arr(p.objectives).map(id=>R.get(id)?.title||id);const boundary='<div class="method"><div><b>目标</b><br>'+esc(objectives.join('；')||'未提取')+'</div><div><b>入口</b><br>'+esc(arr(p.entry_conditions).join('；')||'未提取')+'</div><div><b>出口</b><br>'+esc(arr(p.exit_conditions).join('；')||'未提取')+'</div><div><b>分层依据</b><br>'+esc(p.basis||'未记录')+'</div></div>';html+='<section class="process-box"><div class="tnode">'+caretOf(key,true)+card(p,boundary)+'</div>'+(isCol?'':'<h3>包含的活动与任务</h3>'+(arr(p.children).length?p.children.map(pnode).join(''):'<div class="detail">未提取子活动</div>')+'<h3>流程内流转</h3><div class="flow">'+(edges.length?edges.map(x=>'<button class="chip k-edge" data-id="'+esc(x.id)+'" title="'+esc(x.id)+'"><span class="flow-node">'+esc(R.get(x.from_ref)?.title||x.from_ref)+'</span> <span class="arrow">→</span> <span class="flow-node">'+esc(R.get(x.to_ref)?.title||x.to_ref)+'</span></button>').join(''):'<span class="detail">未提取流转边</span>')+'</div><h3>输入/输出交接</h3>'+(arts.length?arts.map(x=>card(x)).join(''):'<div class="detail">未提取 Artifact</div>'))+'</section>'}document.getElementById('processes').innerHTML=html}
function renderRoles(){const filterOn=document.getElementById('roles-filter')?document.getElementById('roles-filter').checked:true;const rows=matrixRows('r:',elemHasRole,filterOn);let html='<div class="vtoolbar"><button class="filter" data-action="expand" data-scope="r:">全部展开</button><button class="filter" data-action="collapse" data-scope="r:">全部折叠</button><label class="chk"><input type="checkbox" id="roles-filter"'+(filterOn?' checked':'')+'> 仅显示有指派的行</label></div><div class="intro">RACI：R 执行、A 最终负责、C 征询、I 知会、S 支持。单元格点击标记或右侧记录索引，回到该条指派的制度依据。</div><table class="mx" id="roles-matrix"><thead><tr><th class="rowlabel">流程元素</th>'+roleNames.map(n=>'<th>'+esc(n)+'</th>').join('')+'<th>记录索引</th></tr></thead><tbody>';for(const {x,depth} of rows){const kids=arr(x.children);html+='<tr><td class="rowlabel" style="padding-left:'+(8+depth*18)+'px">'+caretOf('r:'+x.id,kids.length)+badge(x.level,'lv-'+x.level)+' <span class="mlink" data-id="'+esc(x.id)+'">'+esc(x.title)+'</span></td>';for(const n of roleNames){const recs=roleCell.get(x.id+'||'+n)||[];html+='<td>'+recs.map(r=>'<button class="chip raci k-role" data-id="'+esc(r.id)+'" title="'+esc(r.id)+'">'+esc(r.raci)+'</button>').join('')+'</td>'}const all=roleRecs.filter(r=>r.element_ref===x.id);html+='<td class="card-id">'+all.map(r=>'<span class="mlink" data-id="'+esc(r.id)+'">'+esc(r.id)+'</span>').join('<br>')+'</td></tr>'}document.getElementById('roles').innerHTML=html+'</tbody></table>'}
function renderTrace(){const filterOn=document.getElementById('trace-filter')?document.getElementById('trace-filter').checked:true;const rows=matrixRows('m:',elemHasTrace,filterOn);let html='<div class="vtoolbar"><button class="filter" data-action="expand" data-scope="m:">全部展开</button><button class="filter" data-action="collapse" data-scope="m:">全部折叠</button><label class="chk"><input type="checkbox" id="trace-filter"'+(filterOn?' checked':'')+'> 仅显示有记录的行</label></div><div class="intro">从流程出发：每个流程元素对应什么目标、规则、风险和控制。记录按实际挂载层级进入单元格，不上卷、不继承；默认折叠到 L3，展开可查看 L4/L5 落点。点击控制或风险时，黄色高亮其配对记录所在行。</div><table class="mx" id="trace-matrix"><thead><tr><th class="rowlabel">流程元素</th><th>目标</th><th>规则</th><th>风险</th><th>控制</th></tr></thead><tbody>';for(const {x,depth} of rows){const t=traceMap.get(x.id)||{objective:[],rule:[],risk:[],control:[]};const kids=arr(x.children);html+='<tr'+(pairElems.has(x.id)?' class="pair"':'')+'><td class="rowlabel" style="padding-left:'+(8+depth*18)+'px">'+crumbOf(x)+caretOf('m:'+x.id,kids.length)+badge(x.level,'lv-'+x.level)+' <span class="mlink" data-id="'+esc(x.id)+'">'+esc(x.title)+'</span></td><td>'+t.objective.map(r=>chip(r)).join('')+'</td><td>'+t.rule.map(r=>chip(r)).join('')+'</td><td>'+t.risk.map(r=>chip(r)).join('')+'</td><td>'+t.control.map(r=>chip(r,arr(r.links).length?' ↔'+arr(r.links).join(','):'')).join('')+'</td></tr>'}html+='</tbody></table>';const issues=byKind('issue');html+='<h2>问题与待确认</h2>'+(issues.length?issues.map(x=>card(x,'<div class="legend">'+badge(x.blocking?'blocking 阻断':'non_blocking 非阻断',x.blocking?'danger':'warn')+(x.risk_level?badge('风险：'+x.risk_level):'')+'</div>')).join(''):'<div class="detail">无记录</div>');const groups=[['规则','rule'],['目标','objective'],['风险','risk'],['控制','control']];html+='<details class="detail-block"><summary>全部记录明细（分组列表）</summary>'+groups.map(([n,k])=>'<h3>'+n+'</h3>'+((byKind(k).map(x=>card(x)).join(''))||'<div class="detail">无记录</div>')).join('')+'</details>';document.getElementById('trace').innerHTML=html}
function renderProjection(){const candidates=byKind('candidate');document.getElementById('projection').innerHTML='<div class="intro"><b>本页展示准备进入本体候选层的数据。</b> 请重点检查 Core 版本、review pool、proposal 类型、parameter target、transition 端点和临时 efio:* 映射。PENDING_CORE_ALIGNMENT 不等于已可正式序列化。</div>'+(candidates.length?candidates.map(x=>{const proposals=arr(x.proposals).map(p=>'<li><span class="card-id">'+esc(p.local_id)+'</span> · '+esc(p.rdf_type)+(p.label?' · '+esc(p.label):'')+(p.properties['efio:mappingStatus']?'<br>'+badge(p.properties['efio:mappingStatus'],'warn'):'')+'</li>').join('');const details='<div class="legend">'+badge('disposition: '+x.disposition)+badge('confidence: '+x.confidence)+badge('Core: '+x.core_version)+badge('review: '+x.review_pool,(x.review_pool==='full'?'warn':''))+'</div><h3>Produces ('+arr(x.proposals).length+')</h3><ul>'+proposals+'</ul><div class="detail">Parameters '+arr(x.parameters).length+' · Transitions '+arr(x.transitions).length+' · Alignments '+arr(x.alignments).length+'</div>';return card(x,details)}).join(''):'<div class="empty">当前导览未加载 candidates.json</div>')}
function matchBlocks(x){if(!x)return[];const exact=M.source_blocks.filter(b=>b.source_key===x.source_key||b.block_id===x.source?.block_id);return exact}
function sources(){const q=document.getElementById('search').value.trim().toLowerCase();const x=R.get(selected);const targets=new Set(x?matchBlocks(x).map(b=>b.block_id):[]);document.getElementById('sources').innerHTML=M.source_blocks.length?M.source_blocks.map(b=>{const hit=q&&(b.text+' '+b.block_id+' '+b.block_path+' '+b.clause_ref).toLowerCase().includes(q);const active=targets.has(b.block_id);return '<section class="source-block'+(active?' active':'')+((q&&!hit)?' dim':'')+'" id="sb-'+esc(b.block_id)+'"><div class="source-meta">'+esc(b.clause_ref||'未编号')+' · '+esc(b.block_path)+' · '+esc(b.block_id)+(b.page_hint?' · 第 '+b.page_hint+' 页':'')+(b.needs_verification?' '+badge('解析待核','warn'):'')+'</div><div class="source-text">'+esc(b.text)+'</div>'+(active&&x?'<div class="explain"><strong>结构化为：</strong> '+kbadge(x.kind)+' '+esc(x.id)+'<br><strong>判断说明：</strong> '+esc(why(x))+(x.confidence&&typeof x.confidence==='object'?'<br><strong>层级置信：</strong> '+Object.entries(x.confidence).map(([k,v])=>esc(k)+' '+esc(v)).join(' · '):'')+'</div>':'')+'</section>'}).join(''):'<div class="empty">没有匹配的原文块</div>';if(targets.size){const el=document.getElementById('sb-'+[...targets][0]);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})}}
function markSelected(){document.querySelectorAll('[data-id]').forEach(e=>{e.classList.toggle('selected',e.dataset.id===selected)})}
function computePair(x){pairElems=new Set();if(!x)return;if(x.kind==='control'){for(const rk of arr(x.links)){const rkRec=R.get(rk);for(const e of arr(rkRec?.links))pairElems.add(e)}}if(x.kind==='risk'){for(const e of arr(x.links))pairElems.add(e)}}
function select(id){selected=id;computePair(R.get(id));renderTrace();markSelected();sources()}
function rerenderScope(scope){if(scope.startsWith('h:'))renderHierarchy();else if(scope.startsWith('p:'))renderProcesses();else if(scope.startsWith('r:'))renderRoles();else if(scope.startsWith('m:'))renderTrace();markSelected()}
document.addEventListener('click',e=>{const tog=e.target.closest('[data-toggle]');if(tog){const k=tog.dataset.toggle;if(collapsed.has(k))collapsed.delete(k);else collapsed.add(k);rerenderScope(k);return}const act=e.target.closest('[data-action]');if(act){const scope=act.dataset.scope;for(const key of [...collapsed])if(key.startsWith(scope))collapsed.delete(key);if(act.dataset.action==='collapse'){for(const x of R.values())if(x.kind==='process'&&arr(x.children).length)collapsed.add(scope+x.id)}rerenderScope(scope);return}if(e.target.id==='clear-loc'){selected='';pairElems=new Set();renderTrace();markSelected();sources();return}const el=e.target.closest('[data-id]');if(el)select(el.dataset.id)});
document.addEventListener('change',e=>{if(e.target.id==='roles-filter'){renderRoles();markSelected()}if(e.target.id==='trace-filter'){renderTrace();markSelected()}});
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('active'));t.classList.add('active');document.getElementById(t.dataset.view).classList.add('active')});
document.getElementById('search').oninput=()=>{const q=document.getElementById('search').value.trim().toLowerCase();document.querySelectorAll('.card').forEach(c=>{const x=R.get(c.dataset.id);c.style.display=!q||(x&&JSON.stringify(x).toLowerCase().includes(q))?'':'none'});sources()};
renderOverview();renderHierarchy();renderProcesses();renderRoles();renderTrace();renderProjection();sources();
</script>
</body></html>
